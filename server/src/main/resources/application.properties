spring.application.name=server
server.port=${PORT:3000}
# 256-bit Hex/Base64 key used to sign your tokens.
application.security.jwt.secret-key=${JWT_SECRET_KEY}
# 15 minutes for access tokens
application.security.jwt.expiration=900000
# 7 days for refresh tokens
application.security.jwt.refresh-token.expiration=604800000

#HTTP request headers and outgoing response status codes
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Database Connection (Injected directly from Render Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool (Prevents startup hangs on Neon serverless Postgres)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true